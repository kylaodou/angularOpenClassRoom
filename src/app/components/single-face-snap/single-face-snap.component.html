<div class="face-snap-card" [ngClass]="{'snapped' : userHasSanped === true}" >
    <img [src]="faceSnap.imageUrl" [alt]="faceSnap.titre">
    <h2>{{ faceSnap.titre | titlecase }}</h2>
    <p>Mis en ligne le {{ faceSnap.createdAt | date : 'dd MMMM y à HH:mm' }}</p>
    <p>{{ faceSnap.description }}</p>
    <p>
        <button id="like" (click)="onSnap()">{{messageSnap}} </button>
        <span [ngStyle]="{color : 'rgb(0,'+ faceSnap.snaps +',0)'}">🤌 {{ faceSnap.snaps }}</span>
    </p>
</div>
